# HTTP: redirect everything to HTTPS.
# Do not serve the shop over plaintext — the session cookie authenticates
# the admin panel too, so it must never travel unencrypted.
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com www.shop.example.com;

    return 301 https://$host$request_uri;
}

# HTTPS: the real site. Run certbot to obtain the certificate files:
#   sudo certbot --nginx -d shop.example.com -d www.shop.example.com
# then reload nginx.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.example.com www.shop.example.com;

    # Certificate paths — adjust if certbot places them elsewhere.
    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    root /var/www/zellie-fleurs/public;
    index index.php;

    access_log /var/log/nginx/zellie-fleurs.access.log;
    error_log /var/log/nginx/zellie-fleurs.error.log;

    client_max_body_size 4M;

    # HSTS: browsers must refuse plaintext connections to this domain.
    # 31536000 = one year. Only ever sent over HTTPS, so it cannot
    # conflict with the PHP security headers (config/database.php owns
    # those — do NOT re-add add_header lines for them here).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param ZF_DEBUG "0";
        fastcgi_param ZF_TZ "Asia/Manila";
    }

    location ~* ^/uploads/.*\.(php|phtml|phar)$ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
