server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com www.shop.example.com;

    root /var/www/zellie-fleurs/public;
    index index.php;

    access_log /var/log/nginx/zellie-fleurs.access.log;
    error_log /var/log/nginx/zellie-fleurs.error.log;

    client_max_body_size 4M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param ZF_DEBUG "0";
        fastcgi_param ZF_TZ "Asia/Manila";
    }

    location ~* ^/uploads/.*\.(php|phtml|phar)$ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
