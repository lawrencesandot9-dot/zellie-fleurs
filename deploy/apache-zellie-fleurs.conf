# HTTP: redirect everything to HTTPS.
# Do not serve the shop over plaintext — the session cookie authenticates
# the admin panel too, so it must never travel unencrypted.
<VirtualHost *:80>
    ServerName shop.example.com
    ServerAlias www.shop.example.com
    ServerAdmin admin@example.com

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# HTTPS: the real site. Run certbot to obtain the certificate files:
#   sudo certbot --apache -d shop.example.com -d www.shop.example.com
# then reload apache.
<VirtualHost *:443>
    ServerName shop.example.com
    ServerAlias www.shop.example.com
    ServerAdmin admin@example.com
    DocumentRoot /var/www/zellie-fleurs/public

    # Certificate paths — adjust if certbot places them elsewhere.
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/shop.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/shop.example.com/privkey.pem

    <Directory /var/www/zellie-fleurs/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # HSTS: browsers must refuse plaintext connections to this domain.
    # 31536000 = one year. Only ever sent over HTTPS, so it cannot conflict
    # with the PHP security headers (config/database.php owns those — do
    # NOT re-add Header lines for them here).
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>

    SetEnv ZF_DEBUG 0
    SetEnv ZF_TZ Asia/Manila

    ErrorLog ${APACHE_LOG_DIR}/zellie-fleurs-error.log
    CustomLog ${APACHE_LOG_DIR}/zellie-fleurs-access.log combined
</VirtualHost>
