<VirtualHost *:80>
    ServerName shop.example.com
    ServerAlias www.shop.example.com
    ServerAdmin admin@example.com
    DocumentRoot /var/www/zellie-fleurs/public

    <Directory /var/www/zellie-fleurs/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    </IfModule>

    SetEnv ZF_DEBUG 0
    SetEnv ZF_TZ Asia/Manila

    ErrorLog ${APACHE_LOG_DIR}/zellie-fleurs-error.log
    CustomLog ${APACHE_LOG_DIR}/zellie-fleurs-access.log combined
</VirtualHost>
